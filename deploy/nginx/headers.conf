# WorldCup Universe — response headers. Nginx drops inherited add_header lines in any location that adds
# its own, so every such location includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security $wcu_hsts always;
